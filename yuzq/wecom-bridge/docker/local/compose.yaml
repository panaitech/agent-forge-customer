# 职责：本机 Docker 运行 WeCom Bridge，通过 host.docker.internal 访问宿主 Agent Forge。
#
# 用法：
#   bash docker/local/deploy.sh up
name: yuzq-wecom-bridge-local

services:
  wecom-bridge:
    image: yuzq-wecom-bridge:${TAG:-latest}
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BRIDGE_HOST_PORT:-8787}:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      DATA_DIR: /app/data
      EXCEPTIONS_PATH: /app/config/exceptions.json
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8787}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-0}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WECOM_TOKEN: ${WECOM_TOKEN:-}
      WECOM_ENCODING_AES_KEY: ${WECOM_ENCODING_AES_KEY:-}
      WECOM_API_BASE: ${WECOM_API_BASE:-https://qyapi.weixin.qq.com}
      AF_TENANT_ID: ${AF_TENANT_ID:-}
      AF_DEFAULT_ROLE: ${AF_DEFAULT_ROLE:-operator}
      # 容器内访问本机 AF：默认改写为 host.docker.internal
      AF_BASE_URL: ${AF_BASE_URL:-http://host.docker.internal:4196}
      AF_CONSOLE_BASE_URL: ${AF_CONSOLE_BASE_URL:-http://host.docker.internal:4196}
      AF_USERNAME: ${AF_USERNAME:-wecom-bridge}
      AF_PASSWORD: ${AF_PASSWORD:-}
      AF_INTAKE_TEAM_ID: ${AF_INTAKE_TEAM_ID:-}
      AF_INTAKE_TEAM_NAME: ${AF_INTAKE_TEAM_NAME:-雨中情-合同录入}
      RUN_POLL_INTERVAL_SEC: ${RUN_POLL_INTERVAL_SEC:-5}
      RUN_POLL_MAX_SEC: ${RUN_POLL_MAX_SEC:-28800}
      TICKET_SECRET: ${TICKET_SECRET:-dev-ticket-secret}
      TICKET_TTL_SEC: ${TICKET_TTL_SEC:-1800}
      BRIDGE_ADMIN_TOKEN: ${BRIDGE_ADMIN_TOKEN:-}
      IDENTITY_AUTO_PROVISION: ${IDENTITY_AUTO_PROVISION:-true}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-20971520}
      DRY_RUN_FORGE: ${DRY_RUN_FORGE:-true}
      DRY_RUN_WECOM_SEND: ${DRY_RUN_WECOM_SEND:-true}
    volumes:
      - bridge-data:/app/data
      - ${EXCEPTIONS_FILE:-../../config/exceptions.example.json}:/app/config/exceptions.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  bridge-data:
