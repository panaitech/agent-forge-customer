# 职责：腾讯云 nginx 片段 —— 将企微回调与确认深链反代到本机 Bridge（127.0.0.1:8787）。
#
# 用法（二选一）：
# 1) 独立子域：server_name bridge.example.com; include 本文件 location；
# 2) 挂到既有 agentforge 网关：复制下列 location 到对应 server {}。
#
# 企微后台回调 URL 示例：
#   https://bridge.example.com/wecom/callback
# 或
#   https://agentforge.club/wecom/callback

# --- 若使用独立 server，取消注释并替换证书路径 ---
# server {
#   listen 443 ssl http2;
#   server_name bridge.example.com;
#   ssl_certificate     /opt/yuzq-wecom-bridge/ssl/fullchain.crt;
#   ssl_certificate_key /opt/yuzq-wecom-bridge/ssl/privkey.key;

  location /wecom/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /confirm {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass http://127.0.0.1:8787/healthz;
    proxy_set_header Host $host;
  }

# }
